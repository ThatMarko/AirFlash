name: Fork isolated diagnostics layout validation
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact own-fork implementation commit to test
        required: true
        type: string
permissions:
  contents: read
jobs:
  ui:
    if: github.repository == 'ThatMarko/AirFlash'
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify exact source
        shell: pwsh
        env:
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REQUESTED_SOURCE -cnotmatch '\A[0-9a-f]{40}\z' -or (git rev-parse HEAD).Trim() -cne $env:REQUESTED_SOURCE) { throw 'Exact source differs.' }
          New-Item -ItemType Directory -Path artifacts/ui-diagnostics -Force | Out-Null
          @{source_sha=$env:REQUESTED_SOURCE;repository=$env:GITHUB_REPOSITORY;run_id=$env:GITHUB_RUN_ID;run_attempt=$env:GITHUB_RUN_ATTEMPT;synthetic=$true} | ConvertTo-Json | Set-Content artifacts/ui-diagnostics/source.json
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build managed app with its DPI manifest
        shell: pwsh
        run: |
          ./scripts/dotnet.ps1 build AirFlash.sln -c Release '-p:RestoreLockedMode=true'
          exit $LASTEXITCODE
      - name: Synthetic fractional DPI with fake services
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path desktop/AirFlash.App/bin/Release/net10.0-windows/win-x64/AirFlash.exe).Path
          @{apphost_sha256=(Get-FileHash $exe -Algorithm SHA256).Hash;app_dll_sha256=(Get-FileHash (Join-Path (Split-Path $exe) 'AirFlash.dll') -Algorithm SHA256).Hash} | ConvertTo-Json | Set-Content artifacts/ui-diagnostics/binary.json
          foreach ($language in @('en-US', 'zh-CN', 'zh-TW')) {
            $report = [IO.Path]::GetFullPath("artifacts/ui-diagnostics/$language/report.json")
            New-Item -ItemType Directory -Path (Split-Path $report) -Force | Out-Null
            $layoutPath = Join-Path (Split-Path $report) 'diagnostics-padding-layout.json'
            foreach ($old in @($report, $layoutPath)) { if (Test-Path -LiteralPath $old) { Remove-Item -LiteralPath $old -Force } }
            $process = Start-Process -FilePath $exe -ArgumentList @('--ui-smoke', '--ui-diagnostics-smoke', '--ui-diagnostics-dpi', '--ui-language', $language, '--ui-culture', 'zh-CN', '--output', ('"' + $report + '"')) -PassThru -WindowStyle Hidden
            try {
              if (-not $process.WaitForExit(45000)) { throw "Synthetic apphost timed out: $language" }
              $exitCode = $process.ExitCode
            } finally {
              try { if (-not $process.HasExited) { $process.Kill($true); $null = $process.WaitForExit(5000) } }
              finally { $process.Dispose() }
            }
            $result = Get-Content $report -Raw | ConvertFrom-Json
            if ($exitCode -ne 0 -or $result.ok -ne $true -or $result.mode -cne '--ui-diagnostics-smoke' -or $result.checks -isnot [Array] -or @($result.checks).Count -eq 0 -or $result.culture -cne 'zh-CN' -or $result.ui_culture -cne $language) { throw "Synthetic apphost DPI check failed: $language" }
            $layout = Get-Content $layoutPath -Raw | ConvertFrom-Json
            if (@($layout.normal).Count -ne 2 -or @($layout.minimum).Count -ne 2) { throw 'Both widths must contain both measured counters.' }
            foreach ($width in @('normal','minimum')) {
              $names = @($layout.$width | ForEach-Object { $_.Name } | Sort-Object)
              if (($names -join '|') -cne 'MonitorFullyPaddedPacketsValue|MonitorPaddedFramesValue') { throw 'Each width must identify both distinct measured counters.' }
            }
            foreach ($card in @($layout.normal) + @($layout.minimum)) {
              if ($card.DpiX -ne 1.25 -or $card.DpiY -ne 1.25 -or $card.Fits -ne $true -or $card.Visible -ne $true -or $card.AllGlyphsInsideValue -ne $true -or $card.RenderedCharacters -ne 20) { throw 'Actual fractional-DPI card qualification is missing.' }
            }
          }
      - name: Preserve source and layout evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-diagnostics-${{ inputs.source_commit }}-${{ github.run_id }}
          path: artifacts/ui-diagnostics/
          if-no-files-found: warn
          retention-days: 14
