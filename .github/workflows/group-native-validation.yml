name: Fork native and managed group validation
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact own-fork implementation commit to test
        required: true
        type: string
      pin_clipboard:
        description: Run the disposable modal PIN clipboard fixture
        required: false
        default: false
        type: boolean
      dns_helper:
        description: Run receiver-free discovery helper process qualification
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  native:
    if: github.repository == 'ThatMarko/AirFlash'
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Verify requested source
        shell: pwsh
        env:
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          if ($env:REQUESTED_SOURCE -cnotmatch '^[0-9a-f]{40}$') { throw 'A full commit SHA is required.' }
          $head = (git rev-parse HEAD).Trim()
          if ($head -cne $env:REQUESTED_SOURCE) { throw 'Checkout does not match requested source.' }
          New-Item -ItemType Directory -Path artifacts/group-native -Force | Out-Null
          @{ source_sha = $head; repository = $env:GITHUB_REPOSITORY; run_id = $env:GITHUB_RUN_ID; run_attempt = $env:GITHUB_RUN_ATTEMPT; rust = (rustc --version); cargo = (cargo --version); unofficial = $true } | ConvertTo-Json | Set-Content artifacts/group-native/source.json
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install locked Python audit dependencies
        shell: pwsh
        run: uv sync --locked
      - name: Native tests, lint and build
        shell: pwsh
        run: |
          ./scripts/build-native.ps1 -Check 2>&1 | Tee-Object -FilePath artifacts/group-native/checks.log
          exit $LASTEXITCODE
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Managed build and tests
        shell: pwsh
        run: |
          ./scripts/check-dotnet.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/dotnet.ps1 build AirFlash.sln -c Release '-p:RestoreLockedMode=true'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./scripts/dotnet.ps1 test AirFlash.Tests/AirFlash.Tests.csproj -c Release --no-build --no-restore --logger 'trx;LogFileName=core.trx' --results-directory "$env:GITHUB_WORKSPACE/artifacts/group-native/core"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          exit $LASTEXITCODE
      - name: Isolated modal PIN paste
        if: inputs.pin_clipboard
        shell: pwsh
        timeout-minutes: 3
        run: |
          $report = [IO.Path]::GetFullPath('artifacts/group-native/pin-ui/report.json')
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report -Force }
          dotnet desktop/AirFlash.App/bin/Release/net10.0-windows/win-x64/AirFlash.dll --ui-smoke --ui-pairing-smoke --ui-pairing-clipboard --ui-language en --ui-culture en-US --output $report
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.ok -ne $true -or $result.mode -cne '--ui-pairing-smoke' -or $result.culture -cne 'en-US' -or $result.ui_culture -cne 'en-US' -or $result.checks -isnot [Array] -or @($result.checks).Count -eq 0 -or $result.checks -cnotcontains 'real PIN paste applies the single-line and sixteen-character editing bounds') { throw 'PIN clipboard report did not prove the requested isolated route and actual paste. Historical sources without that proof cannot qualify this option.' }
      - name: Receiver-free DNS helper process qualification
        if: inputs.dns_helper
        shell: pwsh
        timeout-minutes: 2
        run: |
          $program = Join-Path $env:GITHUB_WORKSPACE 'desktop/AirFlash.App/Program.cs'
          if (-not (Test-Path -LiteralPath $program -PathType Leaf) -or -not (Select-String -LiteralPath $program -SimpleMatch '"--dns-resolve-helper-check"' -Quiet)) { throw 'Historical source lacks the isolated DNS helper dispatch; refusing ordinary application startup.' }
          $report = [IO.Path]::GetFullPath('artifacts/group-native/dns-helper/report.json')
          if (Test-Path -LiteralPath $report) { Remove-Item -LiteralPath $report -Force }
          dotnet desktop/AirFlash.App/bin/Release/net10.0-windows/win-x64/AirFlash.dll --dns-resolve-helper-check --output $report
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($result.ok -ne $true -or $result.synthetic -ne $true -or $result.completedHelpers -ne 6 -or $result.parentAdapterSettled -ne $true -or $result.parentNativeOwners -ne 0 -or @($result.startupAndReplyMilliseconds).Count -ne 3 -or @($result.startupAndReplyMilliseconds | Where-Object { $_ -lt 0 }).Count -gt 0 -or $result.watchdogMilliseconds -le 0) { throw 'DNS helper report did not prove all synthetic child exits and settled ownership.' }
      - name: Preserve exact-source results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-group-${{ inputs.source_commit }}-${{ github.run_id }}
          path: |
            artifacts/group-native/
            artifacts/compatibility/
          if-no-files-found: warn
          retention-days: 14
